            .row {
                opacity: 0;
                animation: reveal 0.08s ease-out forwards;
            }

            @keyframes reveal {
                from {
                    opacity: 0;
                    transform: translateX(-20px);
                }

                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
        </style>
        

