            }

            .muted {
                font-family: "Courier New", monospace;
                font-size: 12px;
                fill: #8b949e;
            }

            .line {
                opacity: 0;
                animation: show 0.35s ease-out forwards;
            }

            @keyframes show {
                from {
                    opacity: 0;
                    transform: translateX(-12px);
                }

                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
        </style>

